upstream php_handler {
    server unix:/var/run/php/php8.5-fpm.sock;
}

server {
    listen 80;
    server_name _;
    root /opt/dreamfactory/public;
    index index.php index.html;
    charset utf-8;
    client_max_body_size 32m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # RFC 8414 / RFC 9728 OAuth discovery for DreamFactory MCP Server.
    # Must be matched BEFORE the generic dotfile deny below.
    location ^~ /.well-known/ {
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri /index.php?$query_string;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php_handler;
        fastcgi_connect_timeout 30;
        fastcgi_send_timeout 180;
        fastcgi_read_timeout 180;
    }

    # Block dotfiles EXCEPT .well-known (RFC 8414/9728 OAuth discovery for MCP).
    location ~ /\.(?!well-known) {
        deny all;
    }
}
