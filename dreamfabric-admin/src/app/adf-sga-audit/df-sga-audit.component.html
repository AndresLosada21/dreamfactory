<mat-card class="sga-audit-card">
  <mat-card-header>
    <fa-icon [icon]="faHistory" class="sga-audit-icon"></fa-icon>
    <mat-card-title>SGA Audit</mat-card-title>
    <mat-card-subtitle>
      Access trail mirrored from SGA (read-only).
    </mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <form class="sga-audit-filters" (ngSubmit)="load()">
      <mat-form-field appearance="outline">
        <mat-label>From</mat-label>
        <input
          matInput
          type="date"
          [(ngModel)]="datStart"
          name="datStart" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>To</mat-label>
        <input matInput type="date" [(ngModel)]="datEnd" name="datEnd" />
      </mat-form-field>
      <button
        mat-flat-button
        color="primary"
        type="submit"
        [disabled]="loading">
        {{ loading ? 'Loading...' : 'Load' }}
      </button>
    </form>
    <mat-progress-bar
      *ngIf="loading"
      mode="indeterminate"></mat-progress-bar>
    <p *ngIf="error" class="sga-audit-error" role="alert">{{ error }}</p>
    <p *ngIf="report" class="sga-audit-total">Total: {{ report.total }}</p>
    <table
      mat-table
      *ngIf="report && report.events.length"
      [dataSource]="report.events"
      class="sga-audit-table">
      <ng-container matColumnDef="datAcesso">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let e">{{ e.datAcesso }}</td>
      </ng-container>
      <ng-container matColumnDef="codUsuario">
        <th mat-header-cell *matHeaderCellDef>User</th>
        <td mat-cell *matCellDef="let e">{{ e.codUsuario }}</td>
      </ng-container>
      <ng-container matColumnDef="nomUsuario">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let e">{{ e.nomUsuario }}</td>
      </ng-container>
      <ng-container matColumnDef="nomPerfil">
        <th mat-header-cell *matHeaderCellDef>Profile</th>
        <td mat-cell *matCellDef="let e">{{ e.nomPerfil }}</td>
      </ng-container>
      <ng-container matColumnDef="refMaquina">
        <th mat-header-cell *matHeaderCellDef>Machine</th>
        <td mat-cell *matCellDef="let e">{{ e.refMaquina }}</td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>
    <p *ngIf="report && !report.events.length" class="sga-audit-empty">
      No events in this range.
    </p>
  </mat-card-content>
</mat-card>
