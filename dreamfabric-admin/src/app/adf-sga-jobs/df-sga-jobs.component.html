<mat-card class="sga-jobs-card">
  <mat-card-header>
    <fa-icon [icon]="faJobs" class="sga-jobs-icon"></fa-icon>
    <mat-card-title>SGA Jobs</mat-card-title>
    <mat-card-subtitle>
      Internal SGA batches, read-only. Email templates live in DreamFactory.
    </mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <button
      mat-flat-button
      color="primary"
      type="button"
      (click)="load()"
      [disabled]="loading">
      {{ loading ? 'Loading...' : 'Reload' }}
    </button>
    <mat-progress-bar
      *ngIf="loading"
      mode="indeterminate"></mat-progress-bar>
    <p *ngIf="error" class="sga-jobs-error" role="alert">{{ error }}</p>
    <p *ngIf="report" class="sga-jobs-total">Total: {{ report.total }}</p>
    <table
      mat-table
      *ngIf="report && report.jobs.length"
      [dataSource]="report.jobs"
      class="sga-jobs-table">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let j">{{ j.id }}</td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let j">{{ j.status }}</td>
      </ng-container>
      <ng-container matColumnDef="datInicio">
        <th mat-header-cell *matHeaderCellDef>Start</th>
        <td mat-cell *matCellDef="let j">{{ j.datInicio }}</td>
      </ng-container>
      <ng-container matColumnDef="datFim">
        <th mat-header-cell *matHeaderCellDef>End</th>
        <td mat-cell *matCellDef="let j">{{ j.datFim }}</td>
      </ng-container>
      <ng-container matColumnDef="tipo">
        <th mat-header-cell *matHeaderCellDef>Type</th>
        <td mat-cell *matCellDef="let j">{{ j.tipo }}</td>
      </ng-container>
      <ng-container matColumnDef="refLoginCad">
        <th mat-header-cell *matHeaderCellDef>Created by</th>
        <td mat-cell *matCellDef="let j">{{ j.refLoginCad }}</td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>
    <p *ngIf="report && !report.jobs.length" class="sga-jobs-empty">
      No jobs found.
    </p>
  </mat-card-content>
</mat-card>
